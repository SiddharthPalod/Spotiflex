services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: spotiflix-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spotiflix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    container_name: spotiflix-api
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - api/.env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=file:./dev.db
      - PYTHONUNBUFFERED=1
      - OPENBLAS_NUM_THREADS=1
      - NODE_ENV=development
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml
      - /app/api/node_modules
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    container_name: spotiflix-frontend
    build:
      context: ./netflix
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://api:3001
    volumes:
      - ./netflix:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
