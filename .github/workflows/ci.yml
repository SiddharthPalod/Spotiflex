# ==============================================================================
# Generated by Zero-Config CI/CD Engine
# Workflow: Node.js CI, Python CI, Docker Build, Publish Docker Image (GHCR) (4 jobs)
# Configuration: Parallel DAG | Dependency Caching: Enabled | Production Hardening: Disabled
# ==============================================================================

name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-node:
    name: Node.js CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: "**/package-lock.json"
  test-python:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      - run: python -m pip install --upgrade pip pytest && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi && for req in $(find . -name 'requirements.txt' -not -path '*/.*' -not -path './requirements.txt'); do pip install -r "$req"; done
      - run: pytest || [ $? -eq 5 ]
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test-node
      - test-python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          push: false
          file: api/Dockerfile
          context: api
  deploy-ghcr:
    name: Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - test-node
      - test-python
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          file: api/Dockerfile
          context: api
